  <script type="text/babel">
    const {useEffect,useMemo,useRef,useState}=React;
    const ADMIN_EMAIL='chimhinhin@gmail.com';
    const SUBJECT_COLORS=['acid','cyan','violet','coral'];
    const DEFAULT_SUBJECTS=['中文','英文','數學','公社','佛學','生物','物理','化學','歷史','電腦','其他'];
    const DEFAULT_SLOTS=[
      {id:'l1',label:'第1節',type:'lesson',startTime:'08:30',duration:35},
      {id:'l2',label:'第2節',type:'lesson',startTime:'09:05',duration:35},
      {id:'b1',label:'小息',type:'break',startTime:'09:40',duration:15},
      {id:'l3',label:'第3節',type:'lesson',startTime:'09:55',duration:35}
    ];
    const EMPTY_SCHEDULE={1:[],2:[],3:[],4:[],5:[]};
    const cx=(...v)=>v.filter(Boolean).join(' ');
    const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const toDate=(v)=>{try{return typeof v?.toDate==='function'?v.toDate():new Date(v)}catch(e){return new Date('invalid')}};
    const prettyDate=(v)=>{const d=toDate(v);if(isNaN(d))return String(v||'—');return d.toLocaleDateString('zh-HK',{month:'short',day:'numeric',weekday:'short'})};
    const prettyTime=(v)=>{const d=toDate(v);if(isNaN(d))return '';return d.toLocaleString('zh-HK',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
    const tomorrowKey=()=>{const d=new Date();d.setDate(d.getDate()+1);return dateKey(d)};
    const subjectTone=(name,subjects)=>SUBJECT_COLORS[Math.max(0,(subjects||DEFAULT_SUBJECTS).indexOf(name))%SUBJECT_COLORS.length];
    const buildSchedule=(config,day,base=new Date())=>{
      const slots=config?.timeSlots||DEFAULT_SLOTS;const names=config?.schedule?.[day]||[];let lesson=0;
      return slots.map(slot=>{const [h,m]=String(slot.startTime||'00:00').split(':').map(Number);const start=new Date(base);start.setHours(h||0,m||0,0,0);const end=new Date(start.getTime()+(Number(slot.duration)||35)*60000);return {...slot,start,end,subjectName:slot.type==='lesson'?(names[lesson++]||'未設定'):slot.label}})
    };
    function Icon({name,size=20}){const ref=useRef(null);useEffect(()=>{if(!ref.current||!window.lucide)return;ref.current.innerHTML='';const i=document.createElement('i');i.dataset.lucide=name;ref.current.appendChild(i);window.lucide.createIcons({root:ref.current})},[name]);return <span ref={ref} className="i" style={{width:size,height:size}}/>}

    function Toast({state}){if(!state.open)return null;return <div className={cx('toast',state.type==='error'&&'error')}><Icon name={state.type==='error'?'triangle-alert':'circle-check'} size={18}/><span>{state.message}</span></div>}

    function ConfirmDialog({state,onClose}){
      if(!state.open)return null;

      return <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
        <div className="dialog" role="alertdialog" aria-modal="true">

          <div className="dialog-body"><p style={{margin:0,lineHeight:1.75,whiteSpace:'pre-line'}}>{state.message}</p></div>
          <div className="dialog-actions"><button className="btn" onClick={onClose}>取消</button><button className="btn danger" onClick={confirm}>確定</button></div>
        </div>
      </div>
    }

    function AuthScreen({notify}){
      const [mode,setMode]=useState('login');const [email,setEmail]=useState('');const [password,setPassword]=useState('');const [busy,setBusy]=useState(false);
      const fb=window.FB||{};
      const friendly=e=>{
        const c=e?.code||'';
        if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(c))return '帳號或密碼不正確。';
        if(c==='auth/email-already-in-use')return '呢個 Email 已經註冊。';
        if(c==='auth/weak-password')return '密碼最少需要 6 個字元。';
        if(c==='auth/invalid-email')return 'Email 格式不正確。';
        if(c==='auth/unauthorized-domain')return '目前網址未加入 Firebase 授權網域。';
        return e?.message||'登入暫時失敗，請稍後再試。'
      };
      const google=async()=>{
        if(!fb.auth)return notify('登入服務未準備好','error');setBusy(true);
        try{await(window.__AUTH_READY__||Promise.resolve());await fb.signInWithPopup(fb.auth,fb.makeGoogle(),fb.browserPopupRedirectResolver)}
        catch(e){
          if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e?.code)){
            try{await fb.signInWithRedirect(fb.auth,fb.makeGoogle(),fb.browserPopupRedirectResolver);return}catch(re){notify(friendly(re),'error')}
          }else notify(friendly(e),'error')
        }finally{setBusy(false)}
      };
      const submit=async e=>{
        e.preventDefault();if(!email.trim())return notify('請輸入 Email。','error');
        setBusy(true);try{
          if(mode==='reset'){await fb.sendPasswordResetEmail(fb.auth,email.trim());notify('重設密碼電郵已發出。');setMode('login')}
          else if(mode==='register'){await fb.createUserWithEmailAndPassword(fb.auth,email.trim(),password)}
          else await fb.signInWithEmailAndPassword(fb.auth,email.trim(),password)
        }catch(err){notify(friendly(err),'error')}finally{setBusy(false)}
      };
      return <main className="auth">
        <section className="auth-poster">
          <div className="brand-lockup"><div className="brand-box">序</div><span>課序</span></div>
          <div className="auth-headline"><div className="eyebrow" style={{color:'#bfc0ff'}}>同班一起記</div><h1>功課有人記，<br/><span>交期唔會漏。</span></h1><p>一位同學補上內容，全班即時見到；每個人仍然保留自己嘅完成進度。</p></div>
          <div className="auth-facts"><div className="auth-fact"><b>01</b><span>班級同步</span></div><div className="auth-fact"><b>02</b><span>個人進度</span></div><div className="auth-fact"><b>03</b><span>每週時間表</span></div></div>
        </section>
        <section className="auth-form"><div className="auth-form-inner">
          <div className="eyebrow">歡迎返嚟</div><h2>{mode==='login'?'登入課序':mode==='register'?'建立帳戶':'重設密碼'}</h2><p className="lead">{mode==='reset'?'輸入 Email，我哋會發送重設連結。':'登入後直接查看今日功課。'}</p>
          <div className="auth-stack">
            {mode!=='reset'&&<><button className="btn dark full" type="button" onClick={google} disabled={busy}><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="19"/>使用 Google 繼續</button><div className="auth-or">或使用 Email</div></>}
            <form className="auth-stack" onSubmit={submit}>
              <div className="field"><label>Email</label><input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@example.com" autoComplete="email"/></div>
              {mode!=='reset'&&<div className="field"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><label>密碼</label>{mode==='login'&&<button className="text-link" type="button" onClick={()=>setMode('reset')}>忘記密碼</button>}</div><input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="最少 6 個字元" autoComplete={mode==='register'?'new-password':'current-password'}/></div>}
              <button className="btn primary full" disabled={busy}>{busy?'處理中…':mode==='login'?'登入':mode==='register'?'建立帳戶':'發送重設連結'}</button>
            </form>
          </div>
          <div className="auth-switch">{mode==='login'?<>未有帳戶？ <button className="text-link" onClick={()=>setMode('register')}>立即建立</button></>:<>已經有帳戶？ <button className="text-link" onClick={()=>setMode('login')}>返回登入</button></>}</div>
          <div className="auth-version">課序 · v2.4</div>
        </div></section>
      </main>
    }

    function TaskComposer({open,onClose,onSubmit,subjects,publishTargets,classes}){

            {broadcast&&<div className="field"><label>發放範圍</label><select className="select" value={target} onChange={e=>setTarget(e.target.value)}>{publishTargets.map(c=><option key={c} value={c}>{className(c)}</option>)}</select></div>}

        </form>

    function EditTaskDialog({item,onClose,onSave}){

    }

    function Topbar({view,setView,isAdmin,name,role,onCompose,onNotices,noticeCount}){
      const tabs=[['agenda','list-todo','今日'],['class','users','班級'],['timetable','calendar-days','時間表'],['history','archive','歷史'],['settings','settings-2','設定']];if(isAdmin)tabs.push(['admin','shield-check','管理']);

    function TaskRow({item,index,subjects,onToggle,onEdit,onDelete}){
      return <article className={cx('task',item.completed&&'done')}><div className="task-index">{String(index+1).padStart(2,'0')}</div><div className="task-main"><div className="task-meta"><span className={cx('tag',subjectTone(item.subject,subjects))}>{item.subject||'其他'}</span><span className="tag muted">{item.type==='assessment'?'測驗':'功課'}</span>{item.publicRefId&&<span className="tag cyan">班級</span>}{item.forceExpired&&<span className="tag coral">已撤回</span>}</div><div className="task-text">{item.description}</div><div className="task-foot"><span>交期 {prettyDate(item.dueDate)}</span>{item.senderName&&<span>由 {item.senderName} 發放</span>}</div></div><div className="task-actions"><button className={cx('check',item.completed&&'on')} onClick={()=>onToggle(item)} aria-label={item.completed?'標示未完成':'標示完成'}>{item.completed&&<Icon name="check" size={18}/>}</button>{!item.forceExpired&&<button className="btn icon small" onClick={()=>onEdit(item)} aria-label="修改"><Icon name="pencil" size={16}/></button>}<button className="btn icon small" onClick={()=>onDelete(item)} aria-label="刪除"><Icon name="trash-2" size={16}/></button></div></article>

    function LessonCard({config,now,onOpen}){
      const day=now.getDay();const rows=buildSchedule(config,day,now);const current=rows.find(r=>now>=r.start&&now<r.end);const next=rows.find(r=>now<r.start);const focus=current||next;const diff=focus?(current?focus.end-now:focus.start-now):0;const min=Math.max(0,Math.floor(diff/60000));
      return <section className="side-card lesson-now"><div className="side-card-head"><span>{current?'而家上緊':'下一節課'}</span><button className="btn small" onClick={onOpen}>完整時間表</button></div><div className="side-card-body">{focus?<><div className="eyebrow" style={{color:'#aabfcb'}}>{focus.start.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})} — {focus.end.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}</div><div className="lesson-clock">{focus.subjectName}</div><div className="lesson-next">{current?`大約仲有 ${min} 分鐘`:`大約 ${min} 分鐘後開始`}</div></>:<><div className="lesson-clock">完成</div><div className="lesson-next">今日未有更多課堂。</div></>}</div></section>
    }

    function AgendaView({items,subjects,config,now,filter,setFilter,sort,setSort,search,setSearch,onToggle,onEdit,onDelete,onViewTimetable,onClearExpired}){
      const active=items.filter(i=>!i.completed&&!i.isHidden);const today=dateKey(),tomorrow=tomorrowKey();const todayItems=active.filter(i=>i.dueDate===today);const doneToday=items.filter(i=>i.completed&&i.dueDate===today).length;const progress=todayItems.length+doneToday?Math.round(doneToday/(todayItems.length+doneToday)*100):100;
      const shown=active.filter(i=>(filter==='全部'||i.subject===filter)&&(!search.trim()||String(i.description).toLowerCase().includes(search.trim().toLowerCase()))).sort((a,b)=>(sort==='asc'?1:-1)*(new Date(a.dueDate)-new Date(b.dueDate)));
      const schedule=buildSchedule(config,now.getDay(),now).filter(x=>x.type==='lesson');
      return <div className="agenda-layout"><section className="ledger"><div className="ledger-title"><h2>未完成清單 · {shown.length}</h2><div className="ledger-tools"><button className="btn small" onClick={onClearExpired}><Icon name="eraser" size={15}/>清理過期</button></div></div><div className="metrics"><button className="metric today" onClick={()=>{setFilter('全部');setSearch('')}}><span>今日到期</span><b>{todayItems.length}</b><div><span>完成 {progress}%</span><div className="progress-line"><i style={{width:`${progress}%`}}/></div></div></button><div className="metric tomorrow"><span>明日功課</span><b>{active.filter(i=>i.dueDate===tomorrow).length}</b><span>提前準備</span></div><div className="metric test"><span>測驗／默書</span><b>{active.filter(i=>i.type==='assessment').length}</b><span>全部未完成</span></div></div><div className="filterbar"><input className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋功課內容…"/><select className="select" value={filter} onChange={e=>setFilter(e.target.value)}><option>全部</option>{subjects.map(s=><option key={s}>{s}</option>)}</select><select className="select" value={sort} onChange={e=>setSort(e.target.value)}><option value="asc">最近交期</option><option value="desc">最遠交期</option></select></div><div className="task-list">{shown.length?shown.map((item,i)=><TaskRow key={item.id} item={item} index={i} subjects={subjects} onToggle={onToggle} onEdit={onEdit} onDelete={onDelete}/>):<div className="empty"><strong>今日清單已經清空</strong>新增一項功課，或者到班級頁查看同學發布內容。</div>}</div></section><aside className="side-stack"><LessonCard config={config} now={now} onOpen={onViewTimetable}/><section className="side-card"><div className="side-card-head"><span>今日課堂</span><span className="tag acid">{schedule.length}</span></div><div className="side-card-body"><div className="mini-list">{schedule.length?schedule.map((r,i)=><div className="mini-row" key={r.id||i}><span className="mini-time">{r.start.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}</span><b>{r.subjectName}</b></div>):<div style={{color:'var(--muted)',fontSize:'.84rem'}}>今日未設定課堂。</div>}</div></div></section></aside></div>
    }

    function ClassView({profile,classes,tasks,subjects,user,isAdmin,publisher,requests,onJoin,onApply,onCompose,onEdit,onWithdraw}){
      const joined=profile?.joinedClasses||[];const boards=['全校',...joined];const [board,setBoard]=useState('全校');useEffect(()=>{if(!boards.includes(board))setBoard('全校')},[joined.join(','),board]);
      const visible=tasks.filter(t=>(t.targetClass||'全校')===board);const boardName=board==='全校'?'全校':classes.find(c=>c.code===board)?.name||board;
      return <div className="class-layout"><aside className="class-panel"><div className="class-panel-head"><div className="eyebrow" style={{color:'#061b2b'}}>CLASS CHANNELS</div><h2>你嘅班級</h2><div style={{fontSize:'.78rem'}}>所有班級內容會自動加入個人清單。</div></div><div className="class-panel-body"><div className="class-tabs">{boards.map(code=>{const count=tasks.filter(t=>(t.targetClass||'全校')===code).length;return <button key={code} className={board===code?'active':''} onClick={()=>setBoard(code)}><span>{code==='全校'?'全校':classes.find(c=>c.code===code)?.name||code}</span><span>{count}</span></button>})}</div><div className="class-actions"><button className="btn" onClick={onJoin}><Icon name="log-in" size={17}/>加入班級</button>{joined.length>0&&!isAdmin&&<button className="btn" onClick={onApply}><Icon name="badge-plus" size={17}/>申請發放</button>}{(isAdmin||publisher.length>0)&&<button className="btn primary" onClick={onCompose}><Icon name="send" size={17}/>發放功課</button>}</div></div></aside><section className="feed"><div className="feed-head"><div><div className="eyebrow">LIVE CLASS FEED</div><h2>{boardName}</h2></div><span className="tag cyan">{visible.length} 項</span></div>{visible.length?visible.map(task=>{const canManage=isAdmin||task.senderUid===user?.uid;return <article key={task.id} className={cx('post',task.forceExpired&&'withdrawn')}><div className="post-avatar">{String(task.senderName||'同').charAt(0)}</div><div><div className="post-top"><div><b>{task.senderName||'同學'}</b><div className="post-author">{task.createdByRole==='admin'?'管理員':task.createdByRole==='publisher'?'發放員':'同學'} · {prettyTime(task.createdAt)}</div></div>{canManage&&!task.forceExpired&&<div style={{display:'flex',gap:7}}><button className="btn icon small" onClick={()=>onEdit({...task,isPublic:true})}><Icon name="pencil" size={15}/></button><button className="btn icon small" onClick={()=>onWithdraw(task)}><Icon name="undo-2" size={15}/></button></div>}</div><div className="post-text">{task.description}</div><div className="post-foot"><div style={{display:'flex',gap:7}}><span className={cx('tag',subjectTone(task.subject,subjects))}>{task.subject||'其他'}</span><span className="tag muted">{task.type==='assessment'?'測驗':'功課'}</span>{task.forceExpired&&<span className="tag coral">已撤回</span>}</div><span>交期 {prettyDate(task.dueDate)}</span></div></div></article>}):<div className="empty"><strong>呢個頻道未有功課</strong>同學發放後會即時出現在這裡。</div>}</section></div>
    }

    function TimetableView({config,onSave,notify}){
      const initialDay=Math.min(5,Math.max(1,new Date().getDay()||1));const [day,setDay]=useState(initialDay);const [editing,setEditing]=useState(false);const [draft,setDraft]=useState(config);useEffect(()=>setDraft(config),[config]);const now=new Date();const rows=buildSchedule(editing?draft:config,day,now);
      const changeSubject=(lessonIndex,value)=>{const schedule={...(draft.schedule||{})};const list=[...(schedule[day]||[])];list[lessonIndex]=value;schedule[day]=list;setDraft({...draft,schedule})};
      const changeSlot=(idx,key,value)=>{const slots=[...(draft.timeSlots||DEFAULT_SLOTS)];slots[idx]={...slots[idx],[key]:key==='duration'?Number(value):value};setDraft({...draft,timeSlots:slots})};
      const save=async()=>{await onSave(draft);setEditing(false);notify('時間表已更新')};
      return <><div style={{display:'flex',justifyContent:'flex-end',gap:9,marginBottom:16}}>{editing?<><button className="btn" onClick={()=>{setDraft(config);setEditing(false)}}>取消</button><button className="btn primary" onClick={save}><Icon name="save" size={17}/>儲存時間表</button></>:<button className="btn primary" onClick={()=>setEditing(true)}><Icon name="pencil-ruler" size={17}/>編輯時間表</button>}</div><div className="week-strip">{[1,2,3,4,5].map(d=><button key={d} className={day===d?'active':''} onClick={()=>setDay(d)}>星期{'一二三四五'[d-1]}</button>)}</div><section className="schedule-board">{rows.map((row,i)=>{const active=day===now.getDay()&&now>=row.start&&now<row.end;const past=day===now.getDay()&&now>row.end;const lessonBefore=(draft.timeSlots||DEFAULT_SLOTS).slice(0,i).filter(s=>s.type==='lesson').length;return <div className={cx('schedule-row',active&&'current',past&&'past')} key={row.id||i}><div className="schedule-cell schedule-time">{editing?<input className="input" type="time" value={row.startTime} onChange={e=>changeSlot(i,'startTime',e.target.value)}/>:<>{row.start.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}<br/>{row.end.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}</>}</div><div className="schedule-cell">{editing?<select className="select" value={row.type} onChange={e=>changeSlot(i,'type',e.target.value)}><option value="lesson">課堂</option><option value="break">休息</option></select>:row.label}</div><div className="schedule-cell schedule-name">{editing&&row.type==='lesson'?<input className="input" value={(draft.schedule?.[day]||[])[lessonBefore]||''} onChange={e=>changeSubject(lessonBefore,e.target.value)} placeholder="科目"/>:editing?<input className="input" value={row.label} onChange={e=>changeSlot(i,'label',e.target.value)}/>:row.subjectName}</div><div className="schedule-cell">{active?<span className="tag">進行中</span>:editing?<input className="input" type="number" min="1" value={row.duration} onChange={e=>changeSlot(i,'duration',e.target.value)} style={{width:85}}/>:<span className="tag muted">{row.duration} 分</span>}</div></div>})}</section></>
    }

    function SettingsView({dark,setDark,compact,setCompact,subjects,setSubjects,user,onSaveSubjects,onLogout,onClearHistory,onClearExpired}){
      const [newSubject,setNewSubject]=useState('');const add=()=>{const n=newSubject.trim();if(n&&!subjects.includes(n)){const next=[...subjects,n];setSubjects(next);onSaveSubjects(next);setNewSubject('')}};const remove=s=>{if(subjects.length<=1)return;const next=subjects.filter(x=>x!==s);setSubjects(next);onSaveSubjects(next)};
      return <div className="settings-grid"><section className="settings-section"><div className="section-head"><h2>顯示方式</h2><Icon name="monitor-cog"/></div><div className="section-body"><div className="setting-row"><div><b>深色模式</b><p>夜晚使用時降低畫面亮度。</p></div><button className={cx('switch',dark&&'on')} onClick={()=>setDark(!dark)}><i/></button></div><div className="setting-row"><div><b>緊湊清單</b><p>同一畫面顯示更多功課。</p></div><button className={cx('switch',compact&&'on')} onClick={()=>setCompact(!compact)}><i/></button></div></div></section><section className="settings-section"><div className="section-head"><h2>帳戶</h2><Icon name="user-round-cog"/></div><div className="section-body"><div><div className="eyebrow">SIGNED IN AS</div><b style={{display:'block',fontSize:'1.1rem',marginTop:7}}>{user?.displayName||'同學'}</b><div style={{color:'var(--muted)',fontSize:'.8rem'}}>{user?.email}</div></div><button className="btn danger full" onClick={onLogout}><Icon name="log-out" size={17}/>登出</button></div></section><section className="settings-section wide"><div className="section-head"><h2>科目清單</h2><span className="tag acid">{subjects.length}</span></div><div className="section-body"><div className="subject-grid">{subjects.map(s=><span className={cx('tag',subjectTone(s,subjects))} key={s}>{s}<button className="text-link" style={{textDecoration:'none',padding:0}} onClick={()=>remove(s)} aria-label={`刪除 ${s}`}>×</button></span>)}</div><div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}><input className="input" value={newSubject} onChange={e=>setNewSubject(e.target.value)} placeholder="新增科目"/><button className="btn primary" onClick={add}>加入</button></div></div></section><section className="settings-section wide"><div className="section-head"><h2>資料整理</h2><Icon name="database"/></div><div className="section-body" style={{gridTemplateColumns:'1fr 1fr'}}><button className="btn" onClick={onClearExpired}><Icon name="eraser" size={17}/>清理過期功課</button><button className="btn" onClick={onClearHistory}><Icon name="archive-x" size={17}/>清理完成紀錄</button></div></section></div>
    }

    function NoticePanel({open,onClose,notices}){if(!open)return null;return <div className="notice-panel"><div className="ledger-title"><h2>通知</h2><button className="btn icon small" onClick={onClose}><Icon name="x" size={16}/></button></div>{notices.length?notices.map((n,i)=><div className="notice-item" key={n.id||i}><b>{n.title}</b><p>{n.message}</p></div>):<div className="empty"><strong>未有新通知</strong>班級更新會顯示喺呢度。</div>}</div>}

    function HistoryView({items,subjects,onToggle,onEdit,onDelete,onClear}){

    }

    function AdminView({db,fb,classes,tasks,config,notify,confirm,onEditTask,onWithdrawTask}){
      const [tab,setTab]=useState('overview');const [users,setUsers]=useState([]);const [requests,setRequests]=useState([]);const [className,setClassName]=useState('');const [viewClass,setViewClass]=useState('');const [allowEmail,setAllowEmail]=useState('');const [announcement,setAnnouncement]=useState(config?.announcementText||'');const [maintenance,setMaintenance]=useState(config?.maintenanceMode||'normal');
      useEffect(()=>setAnnouncement(config?.announcementText||''),[config?.announcementText]);useEffect(()=>setMaintenance(config?.maintenanceMode||'normal'),[config?.maintenanceMode]);
      useEffect(()=>{if(!db)return;const a=fb.onSnapshot(fb.collection(db,'users_public'),s=>setUsers(s.docs.map(d=>({uid:d.id,...d.data()}))),e=>console.warn(e));const b=fb.onSnapshot(fb.collection(db,'publisher_requests'),s=>setRequests(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.warn(e));return()=>{a();b()}},[db]);
      const createClass=async()=>{const name=className.trim();if(!name)return;const code=Math.random().toString(36).slice(2,8).toUpperCase();await fb.setDoc(fb.doc(db,'system_settings','classes'),{list:fb.arrayUnion({code,name,createdAt:new Date().toISOString()})},{merge:true});setClassName('');notify(`已建立 ${name}，代碼 ${code}`)};
      const deleteClass=cls=>confirm(`確定刪除班級「${cls.name}」？班級功課、成員關聯同申請會一併清理。`,async()=>{
        try{let batch=fb.writeBatch(db);const taskSnap=await fb.getDocs(fb.query(fb.collection(db,'public_assignments'),fb.where('targetClass','==',cls.code)));taskSnap.forEach(d=>batch.delete(d.ref));const memberSnap=await fb.getDocs(fb.query(fb.collection(db,'users_public'),fb.where('joinedClasses','array-contains',cls.code)));memberSnap.forEach(d=>{const p=(d.data().publisherClasses||[]).filter(c=>c!==cls.code);batch.update(d.ref,{joinedClasses:fb.arrayRemove(cls.code),publisherClasses:p,role:p.length?'publisher':'member'})});const reqSnap=await fb.getDocs(fb.query(fb.collection(db,'publisher_requests'),fb.where('classCode','==',cls.code)));reqSnap.forEach(d=>batch.delete(d.ref));batch.set(fb.doc(db,'system_settings','classes'),{list:classes.filter(c=>c.code!==cls.code)},{merge:true});await batch.commit();notify('班級已刪除')}catch(e){notify(e.message||'刪除失敗','error')}});
      const review=async(req,status)=>{try{if(status==='approved'){const uref=fb.doc(db,'users_public',req.userUid);await fb.updateDoc(uref,{role:'publisher',publisherClasses:fb.arrayUnion(req.classCode),roleUpdatedAt:new Date().toISOString(),roleUpdatedBy:ADMIN_EMAIL})}await fb.setDoc(fb.doc(db,'publisher_requests',req.id),{status,reviewedAt:new Date().toISOString(),reviewedBy:ADMIN_EMAIL,updatedAt:new Date().toISOString()},{merge:true});notify(status==='approved'?'已批准發放權限':'已拒絕申請')}catch(e){notify(e.message||'處理失敗','error')}};

      const clearHistory=()=>{const targets=items.filter(i=>i.completed&&!i.isHidden);if(!targets.length)return notify('未有完成紀錄');ask(`清理 ${targets.length} 項完成紀錄？`,async()=>{const batch=fb.writeBatch(db);targets.forEach(i=>i.publicRefId?batch.update(fb.doc(db,'users',user.uid,'items',i.id),{isHidden:true}):batch.delete(fb.doc(db,'users',user.uid,'items',i.id)));await batch.commit();notify('完成紀錄已清理')})};
      const saveName=async()=>{const name=nameDraft.trim();if(!name)return;await fb.updateProfile(user,{displayName:name});await fb.setDoc(fb.doc(db,'users_public',user.uid),{email:user.email,displayName:name,joinedClasses:profile?.joinedClasses||[],publisherClasses:profile?.publisherClasses||[],role:profile?.role||'member',lastSeen:fb.serverTimestamp()},{merge:true});notify(`歡迎，${name}`)};
      const notices=useMemo(()=>{const list=[];if(config?.announcementText)list.push({id:'announcement',title:'全校公告',message:config.announcementText});Object.values(requests).filter(Boolean).forEach(r=>list.push({id:r.id+r.status,title:r.status==='approved'?'發放權限已批准':r.status==='pending'?'發放申請審批中':'發放申請狀態更新',message:`${r.className||r.classCode} · ${r.status}`}));visiblePublic.slice(0,5).forEach(t=>list.push({id:t.id,title:`${t.subject||'其他'} · ${t.senderName||'同學'}`,message:t.description}));return list},[config?.announcementText,requests,visiblePublic]);
      if(authLoading)return <div className="loader"><div className="loader-mark">序</div></div>;if(!user)return <><AuthScreen notify={notify}/><Toast state={toast}/></>;
      const maintenance=config?.maintenanceMode||'normal';if(!isAdmin&&maintenance!=='normal')return <BlockScreen title={maintenance==='update'?'系統更新中':'系統維護中'} message={config?.message||'請稍後再試。'}/>;if(!isAdmin&&config?.blacklistEnabled&&(config?.blacklistedEmails||[]).includes(user.email))return <BlockScreen title="帳戶暫停使用" message="請聯絡管理員了解詳情。"/>;if(!isAdmin&&config?.whitelistEnabled&&!(config?.allowedEmails||[]).includes(user.email))return <BlockScreen title="未獲存取權限" message="呢個帳戶未加入允許名單。"/>;
      return <div className="app"><Topbar view={view} setView={setView} isAdmin={isAdmin} name={profile?.displayName||user.displayName} role={role} onCompose={()=>setComposer(true)} onNotices={()=>setNoticeOpen(!noticeOpen)} noticeCount={notices.length}/><main className="workspace">{config?.announcementText&&<div className="announce"><Icon name="megaphone" size={18}/>{config.announcementText}</div>}<PageHead view={view} role={role}/>{view==='agenda'&&<AgendaView items={items} subjects={subjects} config={timetable} now={now} filter={filter} setFilter={setFilter} sort={sort} setSort={setSort} search={search} setSearch={setSearch} onToggle={toggleTask} onEdit={setEditItem} onDelete={deleteTask} onViewTimetable={()=>setView('timetable')} onClearExpired={clearExpired}/>} {view==='class'&&<ClassView profile={profile} classes={classes} tasks={visiblePublic} subjects={subjects} user={user} isAdmin={isAdmin} publisher={publisher} requests={requests} onJoin={()=>setJoinOpen(true)} onApply={()=>setApplyOpen(true)} onCompose={()=>setComposer(true)} onEdit={setEditItem} onWithdraw={withdrawTask}/>} {view==='timetable'&&<TimetableView config={timetable} onSave={saveTimetable} notify={notify}/>} {view==='history'&&<HistoryView items={items} subjects={subjects} onToggle={toggleTask} onEdit={setEditItem} onDelete={deleteTask} onClear={clearHistory}/>} {view==='settings'&&<SettingsView dark={dark} setDark={setDark} compact={compact} setCompact={setCompact} subjects={subjects} setSubjects={setSubjects} user={user} onSaveSubjects={saveSubjects} onLogout={()=>ask('確定登出課序？',()=>fb.signOut(fb.auth))} onClearHistory={clearHistory} onClearExpired={clearExpired}/>} {view==='admin'&&isAdmin&&<AdminView db={db} fb={fb} classes={classes} tasks={publicTasks} config={config} notify={notify} confirm={ask} onEditTask={setEditItem} onWithdrawTask={withdrawTask}/>}</main><TaskComposer open={composer} onClose={()=>setComposer(false)} onSubmit={createTask} subjects={subjects} publishTargets={publishTargets} classes={classes}/><EditTaskDialog item={editItem} onClose={()=>setEditItem(null)} onSave={saveEdit}/><JoinClassDialog open={joinOpen} onClose={()=>setJoinOpen(false)} classes={classes} joined={joined} onJoin={joinClass}/><PublisherDialog open={applyOpen} onClose={()=>setApplyOpen(false)} joined={joined} classes={classes} requests={requests} publisher={publisher} onSend={sendRequest}/><NoticePanel open={noticeOpen} onClose={()=>setNoticeOpen(false)} notices={notices}/><Toast state={toast}/><ConfirmDialog state={confirmState} onClose={()=>setConfirmState({open:false,message:'',action:null})}/>{profile&&!profile.displayName&&<div className="overlay"><div className="dialog"><div className="dialog-head"><h2>設定同學名稱</h2></div><div className="dialog-body"><p style={{margin:0,color:'var(--muted)'}}>班級發放功課時會顯示呢個名稱。</p><input className="input" value={nameDraft} onChange={e=>setNameDraft(e.target.value)} placeholder="你的名字"/></div><div className="dialog-actions"><button className="btn primary full" disabled={!nameDraft.trim()} onClick={saveName}>儲存名稱</button></div></div></div>}</div>
    }

    try{ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}catch(e){console.error(e);document.getElementById('root').innerHTML='<div style="padding:30px;font-family:sans-serif">畫面啟動失敗，請重新整理。</div>'}
  </script>
</body>
</html>
