                const host = window.location.hostname;
                const protocol = window.location.protocol;
                if (!host || protocol === 'file:') return DEFAULT_FIREBASE_AUTH_DOMAIN;
                if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return DEFAULT_FIREBASE_AUTH_DOMAIN;

                // Firebase 官方建議：如果網站在 web.app / Firebase Hosting 自訂網域，authDomain 要盡量同源。

                if (host.endsWith('.web.app') || host.endsWith('.firebaseapp.com')) return host;

                protocol: window.location.protocol || '',
                authDomainUsed: firebaseConfig.authDomain,

            window.__EHANDBOOK_CLEAR_REDIRECT_PENDING__ = () => {
                window.__EHANDBOOK_REDIRECT_PENDING__ = false;

            window.__EHANDBOOK_MARK_REDIRECT_PENDING__ = () => {
                const nowText = String(Date.now());
                window.__EHANDBOOK_REDIRECT_PENDING__ = true;
                window.__EHANDBOOK_AUTH_DEBUG__.redirectStartedAt = nowText;
                try { localStorage.setItem('ehandbook_google_redirect_pending', '1'); } catch(e) {}
                try { localStorage.setItem('ehandbook_google_redirect_started_at', nowText); } catch(e) {}
                try { sessionStorage.setItem('ehandbook_google_redirect_pending', '1'); } catch(e) {}
                try { sessionStorage.setItem('ehandbook_google_redirect_started_at', nowText); } catch(e) {}

                ];

            const redirectSignInSafe = !!window.location.hostname && window.location.hostname === firebaseConfig.authDomain;
            window.firebaseServices = { 
                auth, db, googleProvider, createGoogleProvider,

                signInWithPopup, signInWithRedirect, getRedirectResult, browserPopupRedirectResolver, setPersistence, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, updateProfile,

            };

            try { window.dispatchEvent(new Event('ehandbook:firebase-ready')); } catch(e) {}
        } catch (e) {
            console.error("Firebase Init Error:", e);
            window.__EHANDBOOK_FIREBASE_READY__ = false;
            window.__EHANDBOOK_FIREBASE_INIT_ERROR__ = e;
            try { window.dispatchEvent(new CustomEvent('ehandbook:firebase-error', { detail: e?.message || String(e) })); } catch(eventError) {}
            document.getElementById('loading-screen').innerHTML = "<div style='color:red'>系統連線失敗，請檢查網路。</div>";
        }
