<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Piano AI — 在瀏覽器內把授權音訊轉成簡化的右手旋律 + 左手和弦鋼琴編曲。">
  <title>Piano AI</title>
  <style>

  background: #090b0c;
  font-synthesis: none;
  --bg: #090b0c;
  --panel: rgba(255,255,255,.055);
  --panel-strong: rgba(255,255,255,.085);
  --line: rgba(255,255,255,.11);
  --muted: #9ca5aa;
  --text: #f7f8f8;
  --blue: #7cb8ff;
  --lime: #c7ff78;
  --cream: #f2eee4;
  --cream-ink: #171713;
  --danger: #ff8d8d;
  --radius-xl: 28px;
  --radius-lg: 20px;
  --shadow: 0 24px 80px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-width: 320px; min-height: 100vh; background:
  radial-gradient(circle at 12% 3%, rgba(73,145,255,.16), transparent 30rem),

  linear-gradient(180deg, #0b0d0f, #090b0c 60%); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
.app-shell { width: min(1480px, 100%); margin: 0 auto; padding: 0 28px 80px; }

.search-row { display:flex; gap:10px; }

.btn { min-height:46px; border:0; border-radius:15px; padding:0 18px; font-weight:720; color:#0c0f10; background:#f4f6f6; transition: transform .18s ease, filter .18s ease, opacity .18s; }
.btn:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.04); }
.btn.primary { background:linear-gradient(135deg, #d7ff9b, #a7eaff); }
.btn.secondary { color:var(--text); background:rgba(255,255,255,.075); border:1px solid var(--line); }

.library-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.library-card { padding:16px; border:1px solid var(--line); background:rgba(255,255,255,.035); border-radius:17px; }

.library-actions .btn { min-height:36px; padding:0 12px; font-size:12px; }

.toast { padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:rgba(25,29,31,.94); backdrop-filter:blur(18px); box-shadow:0 14px 45px rgba(0,0,0,.35); color:#eaf0f2; font-size:13px; animation:toast-in .22s ease; }

  .user-chip span { display:none; }

  h1 { font-size:50px; }
  .panel { padding:17px; border-radius:22px; }
  .search-row { flex-direction:column; }

  .score-paper { min-width:760px; }
  .score-toolbar { align-items:flex-start; }
}

<body>
  <div id="app"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- iPad compatibility engine: TensorFlow.js WASM avoids the iOS/WebGL Metal path. -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.js"></script>
  <script type="module">
    // Firebase 官方 Browser Modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, onAuthStateChanged,
      signInWithPopup, signOut, setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-functions.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc, getDoc, getDocs,
      orderBy, query, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


// ===== Single-file configuration =====
// 你可以直接把 Firebase Web App 設定填入這裡；或者在頁面右上角按「設定」後儲存在此瀏覽器。
const DEFAULT_CONFIG = {
  firebase: {
    apiKey: "AIzaSyBZMc5OLUgGFxSRz-EdQLEPKSdsMsILwb0",
    authDomain: "homeai-ca365.firebaseapp.com",
    projectId: "homeai-ca365",
    storageBucket: "homeai-ca365.firebasestorage.app",
    messagingSenderId: "815721283699",
    appId: "1:815721283699:web:1c7a590b85554fd2bf6a06"
  },
  functionsRegion: "us-central1",
  youtubeApiKey: "",
  modelUrl: "https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json"
};

function getRuntimeConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem("pianoAiConfig") || "null");
    if (saved?.firebase) return { ...DEFAULT_CONFIG, ...saved, firebase: { ...DEFAULT_CONFIG.firebase, ...saved.firebase } };
  } catch {}
  return DEFAULT_CONFIG;
}
const RUNTIME_CONFIG = getRuntimeConfig();
const firebaseConfig = RUNTIME_CONFIG.firebase;
const firebaseConfigured = ["apiKey","authDomain","projectId","appId"].every(k => Boolean(firebaseConfig[k]));

let fbApp, auth, db;
if (firebaseConfigured) {
  fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  // Keep the signed-in Google account across reloads on iPad/Safari/GitHub Pages.
  setPersistence(auth, browserLocalPersistence).catch(() => {});
}

function watchAuth(callback) {
  if (!auth) { callback(null); return () => {}; }
  return onAuthStateChanged(auth, callback);
}
async function loginWithGoogle() {
  if (!auth) throw new Error("Firebase 尚未設定。");
  await setPersistence(auth, browserLocalPersistence);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  return await signInWithPopup(auth, provider);
}
async function logout() { if (auth) await signOut(auth); }
async function searchYouTube(queryText) {
  const key = String(RUNTIME_CONFIG.youtubeApiKey || "").trim();
  if (!key) throw new Error("YouTube API Key 尚未設定。請按右上角「設定」填入。");
  const params = new URLSearchParams({
    part: "snippet",
    type: "video",
    maxResults: "8",
    q: queryText,
    key
  });
  const response = await fetch(`https://www.googleapis.com/youtube/v3/search?${params.toString()}`);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const reason = data?.error?.message || `HTTP ${response.status}`;
    throw new Error(`YouTube 搜尋失敗：${reason}`);
  }
  return (data.items || []).map(item => ({
    videoId: item.id?.videoId,
    title: item.snippet?.title || "Untitled",
    channelTitle: item.snippet?.channelTitle || "",
    thumbnail: item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || ""
  })).filter(item => item.videoId);
}
function scoreCollection(uid) { return collection(db, "users", uid, "scores"); }
async function saveScore(uid, score) {
  if (!db) throw new Error("Firebase 尚未設定。");
  const ref = await addDoc(scoreCollection(uid), { ...score, creationTimestamp: serverTimestamp() });
  return ref.id;
}
async function listScores(uid) {
  if (!db) return [];
  const q = query(scoreCollection(uid), orderBy("creationTimestamp", "desc"));
  const snapshot = await getDocs(q);
  return snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
}
async function loadScore(uid, scoreId) {
  if (!db) throw new Error("Firebase 尚未設定。");
  const snapshot = await getDoc(doc(db, "users", uid, "scores", scoreId));
  return snapshot.exists() ? { id: snapshot.id, ...snapshot.data() } : null;
}
async function deleteScore(uid, scoreId) {
  if (!db) throw new Error("Firebase 尚未設定。");
  await deleteDoc(doc(db, "users", uid, "scores", scoreId));
}

// ===== Spotify Basic Pitch model — iPad/Safari compatibility engine =====
// Uses the Spotify Basic Pitch TFJS model, but runs inference through TensorFlow.js WASM
// instead of WebGL. This avoids the known iOS/Metal WebGL shader path that can hang.
// For Piano AI we only need note frames + onsets, so pitch-bend contours are intentionally
// not requested from the model. This reduces browser work and memory use.

const MODEL_URL = RUNTIME_CONFIG.modelUrl;
const BP_SAMPLE_RATE = 22050;
const BP_FFT_HOP = 256;
const BP_AUDIO_WINDOW_SECONDS = 2;
const BP_AUDIO_N_SAMPLES = BP_SAMPLE_RATE * BP_AUDIO_WINDOW_SECONDS - BP_FFT_HOP;
const BP_N_OVERLAPPING_FRAMES = 30;
const BP_OVERLAP_LENGTH_SAMPLES = BP_N_OVERLAPPING_FRAMES * BP_FFT_HOP;
const BP_HALF_OVERLAP_FRAMES = Math.floor(BP_N_OVERLAPPING_FRAMES / 2);
const BP_HOP_SIZE = BP_AUDIO_N_SAMPLES - BP_OVERLAP_LENGTH_SAMPLES;
const BP_FPS = Math.floor(BP_SAMPLE_RATE / BP_FFT_HOP);
const BP_OUTPUT_FRAMES = 'Identity_1';
const BP_OUTPUT_ONSETS = 'Identity_2';

let basicPitchEngine = null;
let aiBackendName = 'not ready';

function nextUiFrame() {
  return new Promise(resolve => setTimeout(resolve, 0));
}

async function prepareAiBackend() {
  const tf = window.tf;
  if (!tf) throw new Error('TensorFlow.js failed to load.');

  if (aiBackendName !== 'not ready') return tf;

  // WASM is used first because Spotify Basic Pitch currently has a known WebGL/Metal
  // failure mode on modern iOS devices. CPU is kept as a last-resort fallback.
  try {
    if (tf.wasm?.setWasmPaths) {
      tf.wasm.setWasmPaths(
        'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/'
      );
    }
    await tf.setBackend('wasm');
    await tf.ready();
    aiBackendName = tf.getBackend() || 'wasm';
  } catch (wasmError) {
    console.warn('WASM backend failed, falling back to CPU:', wasmError);
    await tf.setBackend('cpu');
    await tf.ready();
    aiBackendName = tf.getBackend() || 'cpu';
  }
  return tf;
}

class PianoAIBasicPitch {
  constructor(modelUrl) {
    this.modelUrl = modelUrl;
    this.model = null;
  }

  async load() {
    const tf = await prepareAiBackend();
    if (!this.model) {
      this.model = await tf.loadGraphModel(this.modelUrl);
    }
    return this;
  }

  unwrapOutput(tensor) {
    const sliced = tensor.slice(
      [0, BP_HALF_OVERLAP_FRAMES, 0],
      [1, tensor.shape[1] - 2 * BP_HALF_OVERLAP_FRAMES, -1]
    );
    const shape = sliced.shape;
    const reshaped = sliced.reshape([shape[0] * shape[1], shape[2]]);
    sliced.dispose();
    return reshaped;
  }

  async evaluate(samples, onChunk, onProgress, shouldCancel = () => false) {
    const tf = await prepareAiBackend();
    await this.load();

    // Keep the full song as a Float32Array, but only frame it into model windows.
    // tf.tidy makes intermediate tensors reclaimable immediately.
    const framedInput = tf.tidy(() => {
      const padding = tf.zeros([Math.floor(BP_OVERLAP_LENGTH_SAMPLES / 2)], 'float32');
      const audio = tf.tensor1d(samples, 'float32');
      const padded = tf.concat1d([padding, audio]);
      const framed = tf.signal.frame(
        padded,
        BP_AUDIO_N_SAMPLES,
        BP_HOP_SIZE,
        true,
        0
      );
      return tf.expandDims(framed, -1);
    });

    const totalWindows = framedInput.shape[0];
    const originalOutputFrames = Math.floor(
      samples.length * (BP_FPS / BP_SAMPLE_RATE)
    );
    let deliveredFrames = 0;

    try {
      for (let i = 0; i < totalWindows; i++) {
        if (shouldCancel()) {
          const e = new Error('分析已停止');
          e.code = 'PIANO_AI_CANCELLED';
          throw e;
        }

        onProgress(i / Math.max(1, totalWindows));

        const batch = framedInput.slice(
          [i, 0, 0],
          [1, framedInput.shape[1], framedInput.shape[2]]
        );

        let outputs;
        let frameTensor;
        let onsetTensor;
        let unwrappedFrames;
        let unwrappedOnsets;

        try {
          outputs = this.model.execute(batch, [
            BP_OUTPUT_FRAMES,
            BP_OUTPUT_ONSETS
          ]);
          if (!Array.isArray(outputs) || outputs.length < 2) {
            throw new Error('Basic Pitch model returned an unexpected output.');
          }

          frameTensor = outputs[0];
          onsetTensor = outputs[1];
          unwrappedFrames = this.unwrapOutput(frameTensor);
          unwrappedOnsets = this.unwrapOutput(onsetTensor);

          let framesToRead = unwrappedFrames.shape[0];
          if (deliveredFrames + framesToRead > originalOutputFrames) {
            framesToRead = Math.max(0, originalOutputFrames - deliveredFrames);
          }

          if (framesToRead > 0) {
            const trimmedFrames =
              framesToRead === unwrappedFrames.shape[0]
                ? unwrappedFrames
                : unwrappedFrames.slice([0, 0], [framesToRead, -1]);
            const trimmedOnsets =
              framesToRead === unwrappedOnsets.shape[0]
                ? unwrappedOnsets
                : unwrappedOnsets.slice([0, 0], [framesToRead, -1]);

            try {
              const [frameArray, onsetArray] = await Promise.all([
                trimmedFrames.array(),
                trimmedOnsets.array()
              ]);
              onChunk(frameArray, onsetArray);
              deliveredFrames += framesToRead;
            } finally {
              if (trimmedFrames !== unwrappedFrames) trimmedFrames.dispose();
              if (trimmedOnsets !== unwrappedOnsets) trimmedOnsets.dispose();
            }
          }
        } finally {
          batch.dispose();
          unwrappedFrames?.dispose();
          unwrappedOnsets?.dispose();
          frameTensor?.dispose();
          onsetTensor?.dispose();
          if (Array.isArray(outputs)) {
            outputs.slice(2).forEach(t => t?.dispose?.());
          }
        }

        // Let Safari repaint the progress UI and handle taps between AI windows.
        if (i % 2 === 0) await nextUiFrame();
      }
      onProgress(1);
    } finally {
      framedInput.dispose();
    }
  }
}

// A compact note decoder for Piano AI.
// Basic Pitch produces 88-key frame/onset probabilities. We only need note events
// for simplified melody/chord analysis, not publication-grade MIDI or pitch bends.
function decodeBasicPitchNotes(frames, onsets, {
  onsetThreshold = 0.28,
  frameThreshold = 0.30,
  minFrames = 5,
  releaseTolerance = 5
} = {}) {
  const notes = [];
  if (!frames.length) return notes;

  const pitchCount = Math.min(88, frames[0]?.length || 88);

  const closeNote = (pitchIndex, start, end, ampSum, ampCount) => {
    if (start === null || end - start < minFrames) return;
    const startTimeSeconds = start * BP_FFT_HOP / BP_SAMPLE_RATE;
    const durationSeconds = Math.max(
      BP_FFT_HOP / BP_SAMPLE_RATE,
      (end - start) * BP_FFT_HOP / BP_SAMPLE_RATE
    );
    notes.push({
      pitchMidi: pitchIndex + 21,
      startTimeSeconds,
      durationSeconds,
      amplitude: Math.max(0.01, Math.min(1, ampSum / Math.max(1, ampCount)))
    });
  };

  for (let p = 0; p < pitchCount; p++) {
    let activeStart = null;
    let ampSum = 0;
    let ampCount = 0;
    let lowFrames = 0;
    let previousFrame = 0;

    for (let t = 0; t < frames.length; t++) {
      const frameValue = Number(frames[t]?.[p] || 0);
      const onsetValue = Number(onsets[t]?.[p] || 0);

      const risingFrame =
        frameValue >= frameThreshold + 0.08 &&
        previousFrame < frameThreshold * 0.80;
      const newOnset = onsetValue >= onsetThreshold;

      if (activeStart === null) {
        if (newOnset || risingFrame) {
          activeStart = t;
          ampSum = Math.max(frameValue, onsetValue);
          ampCount = 1;
          lowFrames = 0;
        }
      } else {
        // A clear repeated onset of the same pitch closes the previous note.
        if (newOnset && t - activeStart >= Math.max(minFrames + 2, 8)) {
          closeNote(p, activeStart, t, ampSum, ampCount);
          activeStart = t;
          ampSum = Math.max(frameValue, onsetValue);
          ampCount = 1;
          lowFrames = 0;
        } else {
          ampSum += frameValue;
          ampCount += 1;
          if (frameValue >= frameThreshold) {
            lowFrames = 0;
          } else {
            lowFrames += 1;
          }

          if (lowFrames >= releaseTolerance) {
            const endFrame = Math.max(activeStart + 1, t - lowFrames + 1);
            closeNote(p, activeStart, endFrame, ampSum, ampCount);
            activeStart = null;
            ampSum = 0;
            ampCount = 0;
            lowFrames = 0;
          }
        }
      }
      previousFrame = frameValue;
    }

    if (activeStart !== null) {
      closeNote(p, activeStart, frames.length, ampSum, ampCount);
    }
  }

  return notes.sort((a, b) =>
    a.startTimeSeconds - b.startTimeSeconds ||
    a.pitchMidi - b.pitchMidi
  );
}

async function prepareBasicPitchModel() {
  if (!basicPitchEngine) {
    basicPitchEngine = new PianoAIBasicPitch(MODEL_URL);
    await basicPitchEngine.load();
  }
  return basicPitchEngine;
}

async function transcribe(samples, onProgress = () => {}, shouldCancel = () => false) {
  const engine = await prepareBasicPitchModel();
  const frames = [];
  const onsets = [];

  await engine.evaluate(
    samples,
    (frameChunk, onsetChunk) => {
      frames.push(...frameChunk);
      onsets.push(...onsetChunk);
    },
    progress => onProgress(Math.max(0, Math.min(1, progress))),
    shouldCancel
  );

  return decodeBasicPitchNotes(frames, onsets);
}


// ===== src/music/audio.js =====
const TARGET_RATE = 22050;

async function decodeAndPrepareAudio(file) {
  const bytes = await file.arrayBuffer();
  const decodeContext = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try {
    decoded = await decodeContext.decodeAudioData(bytes.slice(0));
  } finally {
    await decodeContext.close();
  }

  const duration = decoded.duration;
  const targetLength = Math.ceil(duration * TARGET_RATE);
  const offline = new OfflineAudioContext(1, targetLength, TARGET_RATE);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start(0);
  const rendered = await offline.startRendering();

  return {
    samples: new Float32Array(rendered.getChannelData(0)),
    sampleRate: TARGET_RATE,
    duration,
  };
}

function looksLikeAudio(file) {
  if (!file) return false;
  const ext = file.name.toLowerCase().split('.').pop();
  const commonExtensions = new Set(['mp3', 'wav', 'ogg', 'oga', 'flac', 'm4a', 'aac', 'mp4', 'webm']);
  return file.type.startsWith('audio/') || commonExtensions.has(ext);
}



// ===== src/music/keyDetection.js =====
const MAJOR_PROFILE = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
const MINOR_PROFILE = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_ROOTS = new Set([1, 3, 5, 8, 10]);
const FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

function rotate(profile, root) {
  return Array.from({ length: 12 }, (_, pc) => profile[(pc - root + 12) % 12]);
}

function correlation(a, b) {
  const am = a.reduce((x, y) => x + y, 0) / a.length;
  const bm = b.reduce((x, y) => x + y, 0) / b.length;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i] - am;
    const y = b[i] - bm;
    num += x * y;
    da += x * x;
    db += y * y;
  }
  return num / Math.sqrt(Math.max(1e-9, da * db));
}

function detectKey(notes) {
  const histogram = Array(12).fill(0);
  for (const note of notes) {
    const weight = Math.max(0.03, note.durationSeconds) * (0.45 + Math.max(0, note.amplitude));
    histogram[((Math.round(note.pitchMidi) % 12) + 12) % 12] += weight;
  }

  let best = { root: 0, mode: 'major', score: -Infinity };
  for (let root = 0; root < 12; root++) {
    for (const [mode, profile] of [['major', MAJOR_PROFILE], ['minor', MINOR_PROFILE]]) {
      const score = correlation(histogram, rotate(profile, root));
      if (score > best.score) best = { root, mode, score };
    }
  }

  const useFlats = FLAT_ROOTS.has(best.root);
  const rootName = (useFlats ? FLAT_NAMES : SHARP_NAMES)[best.root];
  return {
    ...best,
    rootName,
    displayName: `${rootName} ${best.mode === 'major' ? 'Major' : 'Minor'}`,
    preferFlats: useFlats,
  };
}



// ===== src/music/tempo.js =====
function median(values) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function estimateTempo(notes) {
  const onsets = [...new Set(notes
    .filter((n) => n.amplitude >= 0.25)
    .map((n) => Math.round(n.startTimeSeconds * 50) / 50))]
    .sort((a, b) => a - b);

  const intervals = [];
  for (let i = 1; i < onsets.length; i++) {
    const d = onsets[i] - onsets[i - 1];
    if (d >= 0.18 && d <= 2.0) intervals.push(d);
  }
  if (intervals.length < 2) return 90;

  let beat = median(intervals);
  let bpm = 60 / beat;
  while (bpm < 60) bpm *= 2;
  while (bpm > 180) bpm /= 2;

  const candidates = [];
  for (let candidate = 60; candidate <= 180; candidate++) {
    const period = 60 / candidate;
    let error = 0;
    for (const d of intervals) {
      const multiples = Math.max(1, Math.round(d / period));
      error += Math.abs(d - multiples * period) / multiples;
    }
    candidates.push({ candidate, error: error / intervals.length });
  }
  candidates.sort((a, b) => a.error - b.error);
  bpm = candidates[0]?.candidate ?? bpm;
  return Math.round(bpm);
}



// ===== src/music/chords.js =====
const NOTE_NAMES_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const NOTE_NAMES_FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const MAJOR_DEGREES = [[0, 'maj'], [2, 'min'], [4, 'min'], [5, 'maj'], [7, 'maj'], [9, 'min'], [11, 'dim']];
const MINOR_DEGREES = [[0, 'min'], [2, 'dim'], [3, 'maj'], [5, 'min'], [7, 'min'], [8, 'maj'], [10, 'maj']];

function triad(root, quality) {
  const intervals = quality === 'maj' ? [0, 4, 7] : quality === 'min' ? [0, 3, 7] : [0, 3, 6];
  return intervals.map((i) => (root + i) % 12);
}

function chordName(root, quality, preferFlats) {
  const names = preferFlats ? NOTE_NAMES_FLAT : NOTE_NAMES_SHARP;
  return `${names[root]}${quality === 'min' ? 'm' : quality === 'dim' ? 'dim' : ''}`;
}

function detectChords(notes, key, bpm, duration) {
  const barSeconds = (60 / bpm) * 4;
  const barCount = Math.max(1, Math.ceil(duration / barSeconds));
  const degrees = key.mode === 'major' ? MAJOR_DEGREES : MINOR_DEGREES;
  const candidates = degrees.map(([interval, quality]) => {
    const root = (key.root + interval) % 12;
    return { root, quality, tones: triad(root, quality), name: chordName(root, quality, key.preferFlats) };
  });

  const result = [];
  for (let bar = 0; bar < barCount; bar++) {
    const start = bar * barSeconds;
    const end = start + barSeconds;
    const hist = Array(12).fill(0);
    for (const note of notes) {
      const noteEnd = note.startTimeSeconds + note.durationSeconds;
      const overlap = Math.max(0, Math.min(end, noteEnd) - Math.max(start, note.startTimeSeconds));
      if (overlap <= 0) continue;
      hist[((Math.round(note.pitchMidi) % 12) + 12) % 12] += overlap * (0.4 + note.amplitude);
    }

    let best = candidates[0];
    let bestScore = -Infinity;
    for (const candidate of candidates) {
      const toneScore = candidate.tones.reduce((sum, pc) => sum + hist[pc], 0);
      const rootBonus = hist[candidate.root] * 0.35;
      const nonChordPenalty = hist.reduce((sum, value, pc) => sum + (candidate.tones.includes(pc) ? 0 : value * 0.18), 0);
      const tonicBias = candidate.root === key.root ? 0.06 : 0;
      const score = toneScore + rootBonus + tonicBias - nonChordPenalty;
      if (score > bestScore) {
        best = candidate;
        bestScore = score;
      }
    }
    result.push({ bar: bar + 1, startTimeSeconds: start, durationSeconds: barSeconds, ...best });
  }
  return result;
}



// ===== src/music/melody.js =====
function quantize(value, grid) {
  return Math.round(value / grid) * grid;
}

function extractMelody(notes, bpm, difficulty = 'normal') {
  const beat = 60 / bpm;
  const grid = beat / (difficulty === 'easy' ? 2 : 4);
  const minDuration = difficulty === 'easy' ? 0.14 : 0.08;
  const minAmplitude = difficulty === 'easy' ? 0.28 : 0.18;
  const bucketSize = grid;
  const buckets = new Map();

  for (const note of notes) {
    if (note.durationSeconds < minDuration || note.amplitude < minAmplitude) continue;
    const pitch = Math.round(note.pitchMidi);
    const registerBonus = pitch >= 60 && pitch <= 84 ? 0.45 : pitch >= 55 && pitch <= 88 ? 0.15 : -0.25;
    const durationBonus = Math.min(0.55, note.durationSeconds * 0.4);
    const score = note.amplitude + registerBonus + durationBonus + Math.max(0, (pitch - 60) * 0.003);
    const bucket = Math.round(note.startTimeSeconds / bucketSize);
    const existing = buckets.get(bucket);
    if (!existing || score > existing.score) buckets.set(bucket, { note, score });
  }

  let melody = [...buckets.entries()].sort((a, b) => a[0] - b[0]).map(([bucket, item]) => ({
    pitchMidi: Math.round(item.note.pitchMidi),
    startTimeSeconds: Math.max(0, quantize(bucket * bucketSize, grid)),
    durationSeconds: Math.max(grid, quantize(item.note.durationSeconds, grid)),
    amplitude: item.note.amplitude,
  }));

  if (difficulty === 'easy') {
    melody = melody.filter((note, index, arr) => {
      if (index === 0) return true;
      const prev = arr[index - 1];
      const closeInTime = note.startTimeSeconds - prev.startTimeSeconds < beat / 2;
      const smallMotion = Math.abs(note.pitchMidi - prev.pitchMidi) <= 2;
      return !(closeInTime && smallMotion && index % 2 === 1);
    });
  }

  return melody;
}



// ===== src/music/accompaniment.js =====
function fitRootToLowRegister(rootPc, target = 43) {
  let midi = target + ((rootPc - target) % 12 + 12) % 12;
  while (midi > 52) midi -= 12;
  while (midi < 36) midi += 12;
  return midi;
}

function qualityThird(quality) {
  return quality === 'maj' ? 4 : 3;
}

function buildLeftHand(chords, style = 'root5') {
  return chords.map((chord) => {
    const root = fitRootToLowRegister(chord.root);
    const fifth = root + 7;
    const third = root + qualityThird(chord.quality);
    let pitches;
    switch (style) {
      case 'root': pitches = [root]; break;
      case 'octave': pitches = [root, root + 12]; break;
      case 'broken': pitches = [root, fifth, root + 12, fifth]; break;
      case 'full': pitches = [root, third, fifth]; break;
      case 'root5':
      default: pitches = [root, fifth];
    }
    return { ...chord, style, pitches };
  });
}



// ===== src/music/notation.js =====
const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLATS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
const MINOR_SCALE = [0, 2, 3, 5, 7, 8, 10];

function midiToLetter(midi, preferFlats = false, includeOctave = true) {
  const pc = ((midi % 12) + 12) % 12;
  const octave = Math.floor(midi / 12) - 1;
  return `${(preferFlats ? FLATS : SHARPS)[pc]}${includeOctave ? octave : ''}`;
}

function numericPitch(midi, key) {
  const pc = ((midi % 12) + 12) % 12;
  const scale = key.mode === 'major' ? MAJOR_SCALE : MINOR_SCALE;
  const rel = (pc - key.root + 12) % 12;
  let best = { degree: 0, accidental: '', distance: 99 };
  scale.forEach((scalePc, index) => {
    const up = (rel - scalePc + 12) % 12;
    const signed = up <= 6 ? up : up - 12;
    const distance = Math.abs(signed);
    if (distance < best.distance) {
      best = { degree: index + 1, accidental: signed === 1 ? '#' : signed === -1 ? 'b' : signed > 1 ? `+${signed}` : signed < -1 ? `${signed}` : '', distance };
    }
  });

  const tonicMidiNear = 60 + ((key.root - 0 + 12) % 12);
  const octaveDelta = Math.round((midi - tonicMidiNear) / 12);
  const octaveMark = octaveDelta > 0 ? '′'.repeat(Math.min(2, octaveDelta)) : octaveDelta < 0 ? '̣'.repeat(Math.min(2, -octaveDelta)) : '';
  return `${best.accidental}${best.degree}${octaveMark}`;
}

function formatPitch(midi, mode, key, includeOctave = true) {
  return mode === 'numeric' ? numericPitch(midi, key) : midiToLetter(midi, key.preferFlats, includeOctave);
}

function melodyByBars(melody, bpm, barCount) {
  const barSeconds = (60 / bpm) * 4;
  const bars = Array.from({ length: barCount }, (_, i) => ({ bar: i + 1, notes: [] }));
  for (const note of melody) {
    const index = Math.max(0, Math.min(barCount - 1, Math.floor(note.startTimeSeconds / barSeconds)));
    bars[index].notes.push(note);
  }
  return bars;
}

function formatLeftHand(pitches, mode, key) {
  return pitches.map((m) => formatPitch(m, mode, key, true)).join(' · ');
}



// ===== src/music/analyse.js =====

function analyseTranscription(rawNotes, duration, difficulty, accompanimentStyle, stage) {
  stage('Detecting key');
  const key = detectKey(rawNotes);
  stage('Estimating tempo');
  const bpm = estimateTempo(rawNotes);
  const melody = extractMelody(rawNotes, bpm, difficulty);
  stage('Detecting chords');
  const chords = detectChords(rawNotes, key, bpm, duration);
  stage('Building piano arrangement');
  const leftHand = buildLeftHand(chords, accompanimentStyle);
  return { key, bpm, melody, chords, leftHand, duration };
}

function readableFirebaseError(error) {
  const code = error?.code || '';
  if (code.includes('unauthenticated')) return 'Please sign in with Google first.';
  if (code.includes('permission-denied')) return 'You do not have permission to do that.';
  if (code.includes('popup-closed')) return 'Google 登入視窗未完成就關閉。';
  if (code.includes('unauthorized-domain')) return 'Firebase 未授權呢個 GitHub Pages 網址。請到 Firebase Authentication → Settings → Authorized domains 加入你的 github.io 網域。';
  if (code.includes('popup-blocked')) return 'Safari 阻擋咗 Google 登入視窗。請允許彈出式視窗後再試。';
  if (code.includes('webgl')) return 'iOS WebGL 執行失敗；請使用新版 iPad 相容模式。';
  return error?.message || 'Something went wrong.';
}

function formatClock(seconds) {
  const n = Math.max(0, Math.round(Number(seconds) || 0));
  const m = Math.floor(n / 60);
  const s = n % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function renderProgress(activeStage = stages[0], overall = 0, transcription = null) {
  const area = document.querySelector('#progressArea');
  const activeIndex = stages.indexOf(activeStage);

  // During transcription, the large percentage is the REAL Basic Pitch progress,
  // not the position of the stage in the whole workflow.
  const displayProgress = transcription !== null ? transcription : overall;
  const pct = Math.round(Math.max(0, Math.min(1, displayProgress)) * 100);

  let detail = '';
  if (transcription !== null) {
    const processed = (state.transcriptionDuration || 0) * transcription;
    detail = `
      <div class="analysis-detail">

      </div>`;
  }

  area.innerHTML = `<div class="progress-card">
    <div class="progress-head">
      <strong>${escapeHtml(activeStage)}</strong>
      <span>${pct}%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>

    <div class="status-list">

async function copyTextBestEffort(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return Boolean(ok);
  } catch {
    return false;
  }
}

async function handleGenerate() {
  if (state.processing) return;
  if (!state.user) return toast('Sign in with Google before generating a score.', 'error');
  if (!state.selectedVideo) return toast('請先揀一條 YouTube 影片。', 'error');
  if (!state.file) return toast('本機備用模式需要先選擇音訊檔；如果唔想上傳，請用上面「直接用呢條 YouTube 片轉譜」。', 'error');

  setProcessing(true);
  state.cancelRequested = false;
  state.transcriptionDuration = 0;
  let stageIndex = 0;
  const stage = (name, fractional = 0) => {
    stageIndex = Math.max(0, stages.indexOf(name));
    const overall = Math.min(.98, (stageIndex + fractional) / (stages.length - 1));
    renderProgress(name, overall, name === 'Transcribing notes' ? fractional : null);
  };

  try {
    stage('Loading audio', .1);
    const prepared = await decodeAndPrepareAudio(state.file);
    state.transcriptionDuration = prepared.duration;
    stage('Preparing AI model', .2);
    try { await prepareBasicPitchModel(); }
    catch (error) { throw new Error(`AI model load failure: ${error.message}`); }

    stage('Transcribing notes', 0);
    let rawNotes;
    try {
      rawNotes = await transcribe(
        prepared.samples,
        (p) => stage('Transcribing notes', p),
        () => state.cancelRequested
      );
    } catch (error) {
      if (error?.code === 'PIANO_AI_CANCELLED' || error?.message === '分析已停止') {
        error.code = 'PIANO_AI_CANCELLED';
        throw error;
      }
      throw new Error(`Transcription failure: ${error.message}`);
    }
    if (!rawNotes.length) throw new Error('No usable notes were detected in this audio.');

    const analysed = analyseTranscription(rawNotes, prepared.duration, state.difficulty, state.accompanimentStyle, (name) => stage(name, .4));
    state.currentScore = {
      songTitle: decodeEntities(state.selectedVideo.title),
      youtubeVideoId: state.selectedVideo.videoId,
      detectedKey: analysed.key.displayName,
      keyRoot: analysed.key.root,
      keyRootName: analysed.key.rootName,
      mode: analysed.key.mode,
      preferFlats: analysed.key.preferFlats,
      estimatedBPM: analysed.bpm,
      melodyNoteEvents: analysed.melody,
      chordEvents: analysed.chords,
      selectedLeftHandPattern: state.accompanimentStyle,
      leftHand: analysed.leftHand,
      difficulty: state.difficulty,
      durationSeconds: prepared.duration,
    };
    stage('Complete', 1);
    renderScore();
    toast('Piano score generated.');
    setTimeout(() => document.querySelector('#scoreSection')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  } catch (error) {
    if (error?.code === 'PIANO_AI_CANCELLED') {
      toast('已停止分析。');
      renderProgress('Loading audio', 0, null);
      return;
    }
    console.error(error);
    renderProgress(stages[Math.max(0, stageIndex)], Math.max(.05, stageIndex / stages.length));
    toast(error.message || 'Could not generate the score.', 'error');
  } finally {
    setProcessing(false);
  }
}

function keyFromScore(score) {
  return { root: Number(score.keyRoot), rootName: score.keyRootName, mode: score.mode, displayName: score.detectedKey, preferFlats: Boolean(score.preferFlats) };
}

      <div class="score-paper">
        <div class="score-head">
          <div><h3>${escapeHtml(score.songTitle)}</h3><p>Right hand: simplified melody · Left hand: chord accompaniment</p></div>
          <div class="score-key">${state.notation === 'numeric' ? `1 = ${escapeHtml(score.keyRootName)}` : escapeHtml(score.detectedKey)}<br><span style="font-size:11px;font-weight:600;color:#77776d">≈ ${score.estimatedBPM} BPM · 4/4</span></div>
        </div>
        <div class="bars">
          ${score.chordEvents.map((chord, index) => {
            const melody = melodyBars[index]?.notes || [];
            const left = score.leftHand?.[index]?.pitches || [];
            return `<div class="bar">
              <div class="bar-number">Bar ${index + 1}</div>
              <div class="chord">${escapeHtml(chord.name)}</div>
              <div class="hand"><div class="hand-label">Right hand</div><div class="notes">${melody.length ? melody.map((n) => escapeHtml(formatPitch(n.pitchMidi, state.notation, key, state.notation === 'letter'))).join(' ') : '—'}</div></div>
              <div class="hand"><div class="hand-label">Left hand</div><div class="notes">${left.length ? escapeHtml(formatLeftHand(left, state.notation, key)) : '—'}</div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;

  bindSegmented('#notationControl', (value) => { state.notation = value; renderScore(); });
  document.querySelector('#saveButton').addEventListener('click', handle儲存);
}

async function handle儲存() {
  if (!state.user || !state.currentScore) return;
  const button = document.querySelector('#saveButton');
  button.disabled = true;
  button.textContent = 'Saving…';
  try {
    await saveScore(state.user.uid, {
      songTitle: state.currentScore.songTitle,
      youtubeVideoId: state.currentScore.youtubeVideoId,
      detectedKey: state.currentScore.detectedKey,
      keyRoot: state.currentScore.keyRoot,
      keyRootName: state.currentScore.keyRootName,
      mode: state.currentScore.mode,
      preferFlats: state.currentScore.preferFlats,
      estimatedBPM: state.currentScore.estimatedBPM,
      melodyNoteEvents: state.currentScore.melodyNoteEvents,
      chordEvents: state.currentScore.chordEvents,
      selectedLeftHandPattern: state.currentScore.selectedLeftHandPattern,
      leftHand: state.currentScore.leftHand,
      difficulty: state.currentScore.difficulty,
      durationSeconds: state.currentScore.durationSeconds,
    });
    toast('Score saved to 我的琴譜.');
    await refreshLibrary();
  } catch (error) {
    toast(`Firestore save failure: ${readableFirebaseError(error)}`, 'error');
  } finally {
    button.disabled = false;
    button.textContent = '儲存';
  }
}

async function refreshLibrary() {
  if (!state.user) { state.scores = []; renderLibrary(); return; }
  try { state.scores = await listScores(state.user.uid); }
  catch (error) { state.scores = []; toast(`Could not load 我的琴譜: ${readableFirebaseError(error)}`, 'error'); }
  renderLibrary();
}

function renderLibrary() {
  const section = document.querySelector('#librarySection');
  if (!section) return;
  section.innerHTML = `<div class="panel">
    <div class="panel-title-row"><div><h2>我的琴譜</h2><p class="panel-subtitle">已儲存的編曲只屬於你的 Firebase 帳戶。</p></div><div class="step-badge">03</div></div>
    ${!state.user ? `<div class="empty">Sign in to see your saved scores.</div>` : !state.scores.length ? `<div class="empty">No saved scores yet. Generate a score and press 儲存.</div>` : `<div class="library-grid">${state.scores.map((score) => `<article class="library-card">
      <h4>${escapeHtml(score.songTitle || 'Untitled score')}</h4>
      <div class="library-meta">${escapeHtml(score.detectedKey || '')} · ${escapeHtml(score.estimatedBPM || '')} BPM</div>
      <div class="library-actions"><button class="btn secondary" data-open-score="${escapeHtml(score.id)}">打開</button><button class="btn danger" data-delete-score="${escapeHtml(score.id)}">刪除</button></div>
    </article>`).join('')}</div>`}
  </div>`;

  section.querySelectorAll('[data-open-score]').forEach((button) => button.addEventListener('click', async () => {
    try {
      const saved = await loadScore(state.user.uid, button.dataset.openScore);
      if (!saved) return toast('That saved score no longer exists.', 'error');
      state.currentScore = saved;
      state.accompanimentStyle = saved.selectedLeftHandPattern || 'root5';
      renderScore();
      document.querySelector('#scoreSection')?.scrollIntoView({ behavior: 'smooth' });
    } catch (error) { toast(readableFirebaseError(error), 'error'); }
  }));
  section.querySelectorAll('[data-delete-score]').forEach((button) => button.addEventListener('click', async () => {
    const id = button.dataset.deleteScore;
    button.disabled = true;
    try {
      await deleteScore(state.user.uid, id);
      toast('Score deleted.');
      await refreshLibrary();
    } catch (error) {
      button.disabled = false;
      toast(readableFirebaseError(error), 'error');
    }
  }));
}

renderShell();
watchAuth(async (user) => {
  state.user = user;
  renderAuth();
  if (!user) {
    state.scores = [];
    renderLibrary();
  } else {
    await refreshLibrary();
  }
});



  </script>
</body>
</html>
